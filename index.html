<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0803" />

    <!-- The three faces the first screen actually asks for: the intro sets the
         name in Neue Montreal Medium and its label in Space Mono, and the hero
         behind it takes Neue Montreal Regular as the body default. Without
         these the browser only discovers them after the stylesheet parses,
         which is a round trip into the middle of the intro.
         `crossorigin` is required even same-origin, or the preload is
         discarded and the font fetched a second time. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/NeueMontreal/NeueMontreal-Medium.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/NeueMontreal/NeueMontreal-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/SpaceMono/SpaceMono-Regular.woff2" />

    <title>MaiHoa — UI/UX Designer</title>
    <meta
      name="description"
      content="UI/UX designer with 4 years of experience, blending strategic UX thinking with sharp visual artistry across Web, App, SaaS and Game UI."
    />

    <!-- Link previews. Without these a shared URL renders as a bare domain,
         which for a portfolio is the one place the link is going to be used. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MaiHoa — UI/UX Designer" />
    <meta
      property="og:description"
      content="UI/UX designer with 4 years of experience, blending strategic UX thinking with sharp visual artistry across Web, App, SaaS and Game UI."
    />
    <meta property="og:image" content="/images/hero-3d.webp" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
